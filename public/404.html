<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
    <script>
      // Récupère le chemin de l'URL actuelle
      const path = window.location.pathname;
      // Redirige vers l'index.html avec le chemin en tant que paramètre de recherche
      window.location.href = '/index.html?p=' + encodeURIComponent(path + window.location.search + window.location.hash);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/index.html">
    </noscript>
  </head>
  <body>
    <p>Redirection en cours... Si vous n'êtes pas redirigé, <a href="/index.html">cliquez ici</a>.</p>
  </body>
</html>
